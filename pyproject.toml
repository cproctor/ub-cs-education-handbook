[project]
name = "ub-cs-education-handbook"
version = "1.0.0"
description = "UB's Computer Science Teacher Preparation Program Handbook"
authors = [
    {name="Chris Proctor", email="chris@chrisproctor.net>"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "invoke (>=2.2.0,<3.0.0)",
    "more-itertools (>=10.7.0,<11.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "pyaml (>=25.7.0,<26.0.0)"
]

